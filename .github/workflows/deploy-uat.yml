name: Deploy Backend (UAT)

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    name: Deploy to UAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UAT branch
        uses: actions/checkout@v4

      - name: Sync backend code to UAT server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_SERVER_IP }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "."
          target: /var/www/gloup/uat/backend/Gloup-Test-Backend
          overwrite: true
          strip_components: 0

      - name: Build and restart UAT backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UAT_SERVER_IP }}
          username: ${{ secrets.UAT_SSH_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/gloup/uat/backend/Gloup-Test-Backend

            echo "Building and starting containers (UAT host ports 3307/6380)..."
            # Port overrides only — app secrets still come from .env
            set -a
            # shellcheck disable=SC1091
            . ./.env.uat.ports
            set +a
            docker compose up -d --build

            echo "Waiting for app container to accept exec..."
            ready=0
            for i in $(seq 1 60); do
              if docker compose exec -T app true >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "ERROR: app container not ready for exec"
              docker compose ps
              docker compose logs --tail=100 app || true
              exit 1
            fi

            echo "Applying pending DB migrations..."
            docker compose exec -T app node scripts/migrate.mjs up

            echo "Migration status:"
            docker compose exec -T app node scripts/migrate.mjs status

            echo "Waiting for app health..."
            healthy=0
            for i in $(seq 1 40); do
              if docker compose exec -T app node -e "fetch('http://127.0.0.1:5678/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                healthy=1
                break
              fi
              sleep 3
            done
            if [ "$healthy" -ne 1 ]; then
              echo "ERROR: app health check failed after migrate"
              docker compose logs --tail=120 app || true
              exit 1
            fi

            echo "Cleaning up old dangling images..."
            docker image prune -f

            echo "UAT deployment completed"
            docker compose ps
            docker ps
